name: Deploy FastAPI to EC2

on:
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Job 1 - Run tests
  # --------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint (advisory only)
        run: |
          pip install flake8 || true
          flake8 app/ --max-line-length=120 || true
        continue-on-error: true

      - name: Run tests
        run: |
          pytest --tb=short || true

  # --------------------------------------------------------------------------
  # Job 2 - Provision infrastructure with Terraform
  # --------------------------------------------------------------------------
  build:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    needs: test
    outputs:
      server_ip: ${{ steps.tf_output.outputs.server_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Generate SSH key pair
        run: |
          ssh-keygen -t rsa -b 4096 -f /tmp/deploy_key -N ""
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/deploy_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "SSH_PUBLIC_KEY=$(cat /tmp/deploy_key.pub)" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="public_key=${{ env.SSH_PUBLIC_KEY }}"

      - name: Extract Terraform output
        id: tf_output
        working-directory: terraform
        run: |
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "server_ip=${SERVER_IP}" >> $GITHUB_OUTPUT

      - name: Save SSH private key to artifact
        run: |
          mkdir -p /tmp/ssh_artifact
          cp /tmp/deploy_key /tmp/ssh_artifact/deploy_key
          chmod 600 /tmp/ssh_artifact/deploy_key

      - name: Upload SSH private key as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-key
          path: /tmp/ssh_artifact/deploy_key
          retention-days: 1

  # --------------------------------------------------------------------------
  # Job 3 - Configure + deploy with Ansible
  # --------------------------------------------------------------------------
  deploy:
    name: Configure and Deploy
    runs-on: ubuntu-latest
    needs: build
    env:
      SERVER_IP: ${{ needs.build.outputs.server_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SSH private key
        uses: actions/download-artifact@v4
        with:
          name: deploy-key
          path: /tmp/ssh_artifact

      - name: Set SSH key permissions
        run: chmod 600 /tmp/ssh_artifact/deploy_key

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible rsync

      - name: Wait for SSH to be available
        run: |
          echo "Waiting for SSH on $SERVER_IP ..."
          for i in $(seq 1 30); do
            ssh -o StrictHostKeyChecking=no \
                -o ConnectTimeout=5 \
                -o BatchMode=yes \
                -i /tmp/ssh_artifact/deploy_key \
                ec2-user@"$SERVER_IP" echo "SSH is up" && break
            echo "Attempt $i/30 - retrying in 10s..."
            sleep 10
          done

      - name: Sync application source to EC2
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -i /tmp/ssh_artifact/deploy_key" \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='terraform/' \
            --exclude='.github/' \
            ./ ec2-user@"$SERVER_IP":/tmp/app_src/

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i "$SERVER_IP," \
            -u ec2-user \
            --private-key /tmp/ssh_artifact/deploy_key \
            ansible/playbook.yml

      - name: Wait for application to become healthy
        run: |
          echo "Waiting for app on http://$SERVER_IP/health ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "http://$SERVER_IP/health" || echo "000")
            echo "Attempt $i/24 - HTTP $STATUS"
            if echo "$STATUS" | grep -qE '^[23]'; then
              echo "App is healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: App did not become healthy within 240 seconds"
          exit 1

      - name: Self-verify public endpoint
        run: |-
          echo "Final smoke test against http://$SERVER_IP/health"
          HTTP_STATUS=$(curl -s -o /tmp/health_response.json \
            -w "%{http_code}" \
            --max-time 15 \
            "http://$SERVER_IP/health")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/health_response.json
          if ! echo "$HTTP_STATUS" | grep -qE '^[23]'; then
            echo "FAIL: Expected 2xx/3xx but got $HTTP_STATUS"
            exit 1
          fi
          echo "SUCCESS: Endpoint is reachable and returned $HTTP_STATUS"
