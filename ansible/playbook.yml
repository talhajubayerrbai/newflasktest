---
- name: Configure EC2 instance and deploy FastAPI app
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/app
    venv_dir: /opt/app/.venv
    app_user: ubuntu
    app_group: ubuntu
    gunicorn_bin: /opt/app/.venv/bin/gunicorn
    python_bin: /opt/app/.venv/bin/python

  tasks:

    # -------------------------------------------------------------------------
    # System packages
    # -------------------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - python3.11
          - python3.11-venv
          - python3.11-dev
          - python3-pip
          - nginx
          - rsync
          - curl
          - git
          - build-essential
        state: present

    # -------------------------------------------------------------------------
    # App directory
    # -------------------------------------------------------------------------
    - name: Create /opt/app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    # -------------------------------------------------------------------------
    # Copy app source from rsync staging area
    # -------------------------------------------------------------------------
    - name: Copy app source from staging to /opt/app
      shell: |
        rsync -a --delete \
          --exclude='.git' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.venv' \
          --exclude='venv' \
          /tmp/app_source/ {{ app_dir }}/
      args:
        executable: /bin/bash

    - name: Set ownership on /opt/app
      file:
        path: "{{ app_dir }}"
        state: directory
        recurse: true
        owner: "{{ app_user }}"
        group: "{{ app_group }}"

    # -------------------------------------------------------------------------
    # Python virtualenv and dependencies
    # -------------------------------------------------------------------------
    - name: Create Python virtualenv at /opt/app/.venv
      become_user: "{{ app_user }}"
      command: python3.11 -m venv {{ venv_dir }}
      args:
        creates: "{{ venv_dir }}/bin/activate"

    - name: Upgrade pip inside venv
      become_user: "{{ app_user }}"
      command: "{{ venv_dir }}/bin/pip install --upgrade pip"

    - name: Install Python dependencies from requirements.txt
      become_user: "{{ app_user }}"
      command: "{{ venv_dir }}/bin/pip install -r {{ app_dir }}/requirements.txt"
      args:
        chdir: "{{ app_dir }}"

    - name: Ensure gunicorn and uvicorn are installed in venv
      become_user: "{{ app_user }}"
      command: "{{ venv_dir }}/bin/pip install gunicorn uvicorn[standard]"

    # -------------------------------------------------------------------------
    # Systemd service
    # -------------------------------------------------------------------------
    - name: Write systemd service unit for the app
      copy:
        dest: /etc/systemd/system/app.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=FastAPI app via gunicorn+uvicorn
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_dir }}
          Environment="PATH={{ venv_dir }}/bin:/usr/local/bin:/usr/bin:/bin"
          ExecStart={{ gunicorn_bin }} app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable and start app service
      systemd:
        name: app
        enabled: true
        state: restarted

    # -------------------------------------------------------------------------
    # nginx reverse proxy
    # -------------------------------------------------------------------------
    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Write nginx site config - proxy port 80 to 127.0.0.1:8000
      copy:
        dest: /etc/nginx/sites-available/app
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              client_max_body_size 20M;

              location / {
                  proxy_pass         http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
                  proxy_connect_timeout 10s;
              }
          }

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Test nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Enable and restart nginx
      systemd:
        name: nginx
        enabled: true
        state: restarted

    # -------------------------------------------------------------------------
    # Health check - verify app is up on the instance before Ansible exits
    # -------------------------------------------------------------------------
    - name: Wait for gunicorn to be listening on port 8000
      wait_for:
        host: 127.0.0.1
        port: 8000
        timeout: 60
        delay: 5

    - name: Verify app health endpoint responds
      uri:
        url: http://127.0.0.1:8000/health
        method: GET
        status_code: 200
        timeout: 15
      register: health_result
      retries: 6
      delay: 10
      until: health_result.status == 200