---
- name: Configure EC2 and deploy FastAPI application
  hosts: all
  become: true
  vars:
    app_dir: /opt/app
    venv_dir: /opt/app/.venv
    app_user: appuser
    app_group: appuser
    python_bin: /usr/bin/python3.11

  tasks:

    # -------------------------------------------------------------------------
    # System packages
    # -------------------------------------------------------------------------

    - name: Update dnf cache
      dnf:
        update_cache: true

    - name: Install required system packages
      dnf:
        name:
          - python3.11
          - python3.11-pip
          - python3.11-devel
          - nginx
          - rsync
          - gcc
          - git
        state: present

    # -------------------------------------------------------------------------
    # Application user
    # -------------------------------------------------------------------------

    - name: Create application group
      group:
        name: "{{ app_group }}"
        state: present

    - name: Create application user
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        shell: /sbin/nologin
        home: "{{ app_dir }}"
        create_home: false
        state: present

    # -------------------------------------------------------------------------
    # Application directory
    # -------------------------------------------------------------------------

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    # -------------------------------------------------------------------------
    # Copy application source from staging area
    # -------------------------------------------------------------------------

    - name: Copy application source to /opt/app
      shell: |
        rsync -a --delete \
          --exclude='.git' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.venv' \
          --exclude='terraform/' \
          --exclude='.github/' \
          /tmp/app_src/ {{ app_dir }}/
      args:
        executable: /bin/bash

    - name: Set ownership on application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        recurse: true
        owner: "{{ app_user }}"
        group: "{{ app_group }}"

    # -------------------------------------------------------------------------
    # Python virtual environment
    # -------------------------------------------------------------------------

    - name: Create Python 3.11 virtual environment
      command: "{{ python_bin }} -m venv {{ venv_dir }}"
      args:
        creates: "{{ venv_dir }}/bin/activate"
      become_user: "{{ app_user }}"

    - name: Upgrade pip inside venv
      command: "{{ venv_dir }}/bin/pip install --upgrade pip"
      become_user: "{{ app_user }}"

    - name: Install application dependencies
      command: "{{ venv_dir }}/bin/pip install -r {{ app_dir }}/requirements.txt"
      become_user: "{{ app_user }}"

    - name: Install gunicorn and uvicorn worker
      command: "{{ venv_dir }}/bin/pip install gunicorn uvicorn[standard]"
      become_user: "{{ app_user }}"

    # -------------------------------------------------------------------------
    # Systemd service
    # -------------------------------------------------------------------------

    - name: Deploy systemd unit file for the app
      copy:
        dest: /etc/systemd/system/app.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=FastAPI application (gunicorn + uvicorn)
          After=network.target

          [Service]
          Type=notify
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_dir }}
          ExecStart={{ venv_dir }}/bin/gunicorn app.main:app \
            -k uvicorn.workers.UvicornWorker \
            -w 4 \
            -b 0.0.0.0:8000
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=app

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable and start app service
      systemd:
        name: app
        enabled: true
        state: restarted

    # -------------------------------------------------------------------------
    # Nginx configuration
    # -------------------------------------------------------------------------

    - name: Write nginx virtual-host configuration
      copy:
        dest: /etc/nginx/conf.d/app.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location / {
                  proxy_pass         http://127.0.0.1:8000;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
                  proxy_connect_timeout 10s;
              }
          }

    - name: Remove default nginx config if present
      file:
        path: /etc/nginx/conf.d/default.conf
        state: absent

    - name: Enable and restart nginx
      systemd:
        name: nginx
        enabled: true
        state: restarted

    # -------------------------------------------------------------------------
    # Local health check (gunicorn must be listening before we proceed)
    # -------------------------------------------------------------------------

    - name: Wait for gunicorn to be ready on port 8000
      wait_for:
        host: 127.0.0.1
        port: 8000
        timeout: 60
        state: started

    - name: Verify local health endpoint responds 200
      uri:
        url: "http://localhost:8000/health"
        method: GET
        status_code: 200
        timeout: 15
      register: health_result
      retries: 6
      delay: 10
      until: health_result.status == 200